# Пайплайн stirkabot-core для GitHub Actions: build → lint → test → package
#
# Когда запускается: только для pull request и для push в main.
# Push тегов не запускает пайплайн: у push указан фильтр branches, а теги в него не попадают.

name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  # ---------- build ----------
  build:
    name: build — сборка wheel
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          # кэш pip; ключ меняется только при изменении requirements-dev.txt
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - run: pip install -q -r requirements-dev.txt
      - run: python -m build --wheel
      - run: |
          pip install -q dist/*.whl
          python -c "import stirkabot; print('stirkabot', stirkabot.__version__)"
      - uses: actions/upload-artifact@v4
        with:
          name: wheel
          path: dist/
          retention-days: 7

  # ---------- lint ----------
  # continue-on-error: падение линтера видно красным в интерфейсе и замечаниями прямо
  # в diff pull request, но весь пайплайн не падает. Тесты от линтера не зависят.
  lint:
    name: lint — ruff (не блокирует)
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - run: pip install -q -r requirements-dev.txt
      - run: ruff check --output-format=github src tests
      - run: ruff format --check src tests

  # Эксперимент: строгая проверка типов, только предупреждение
  mypy:
    name: mypy — эксперимент (не блокирует)
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - run: pip install -q -r requirements-dev.txt
      - run: mypy

  # ---------- test ----------
  test:
    name: test — pytest и покрытие
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - run: pip install -q -r requirements-dev.txt
      - run: pytest --junitxml=report.xml --cov --cov-report=term --cov-report=xml:coverage.xml | tee pytest.txt
      - name: Итог в сводку пайплайна
        if: always()
        run: |
          echo "### Тесты" >> "$GITHUB_STEP_SUMMARY"
          grep -E "passed|failed" pytest.txt | tail -1 >> "$GITHUB_STEP_SUMMARY" || true
          echo "### Покрытие" >> "$GITHUB_STEP_SUMMARY"
          grep -E "^TOTAL" pytest.txt >> "$GITHUB_STEP_SUMMARY" || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-reports
          path: |
            report.xml
            coverage.xml
          retention-days: 7

  # Эксперимент: работает ли код на следующей версии Python
  test-py313:
    name: test — Python 3.13 (эксперимент, не блокирует)
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - run: pip install -q -r requirements-dev.txt
      - run: pytest -q

  # ---------- package ----------
  package:
    name: package — архив для выкладки
    needs: [build, test]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: wheel
          path: dist/
      - run: |
          VERSION=$(python3 -c "import tomllib; print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")
          mkdir -p package
          cp dist/*.whl README.md package/
          (cd package && sha256sum *.whl > SHA256SUMS)
          tar -czf "stirkabot-core-$VERSION.tar.gz" -C package .
          ls -l "stirkabot-core-$VERSION.tar.gz"
      - uses: actions/upload-artifact@v4
        with:
          name: release-archive
          path: stirkabot-core-*.tar.gz
          retention-days: 30
